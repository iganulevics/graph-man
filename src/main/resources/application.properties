# Server Configuration
server.port=8083

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Request Storage
graphman.storage.path=saved-requests

# Shopify AI Configuration
shopify.ai.url=https://shopify.dev/assistant/conversations

# Logging
logging.level.com.graphman=DEBUG
